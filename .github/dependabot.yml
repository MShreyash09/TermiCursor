# Weekly dependency updates, grouped so security fixes arrive as a few PRs, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /landing-page
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
