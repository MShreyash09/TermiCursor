name: CI

# Every push and PR runs the whole offline test suite, so a new feature can't silently
# break an old one. It also fails when backend code changes without a test change,
# so every new feature has to come with its own tests.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The app ships for Windows only, mac & linux will be shipped later.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the test check below can diff against the base

      - name: Require tests with backend changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch or the first push has no usable base: nothing to compare.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare against; skipping."; exit 0
          fi
          if git log --format=%B "$base..HEAD" | grep -q "\[skip-test-check\]"; then
            echo "[skip-test-check] found in a commit message; skipping."; exit 0
          fi
          changed=$(git diff --name-only "$base...HEAD")
          src=$(echo "$changed" | grep -E '^(core/.*|server|main|cli|rag)\.py$' || true)
          tests=$(echo "$changed" | grep -E '^tests/test_.*\.py$' || true)
          if [ -n "$src" ] && [ -z "$tests" ]; then
            echo "::error::Backend code changed but no tests/test_*.py was added or updated:"
            echo "$src"
            echo "Add a test for the change, or put [skip-test-check] in a commit message for refactors/docs-only edits."
            exit 1
          fi
          echo "OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Backend tests (offline; tests/live_* need Ollama and are skipped)
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q tests --ignore-glob="tests/live_*"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p .
